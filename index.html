<!DOCTYPE html>
<html>
<head>
<title>Nova Designs AI Assistant</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  padding: 40px;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
}
h1 {
  color: #333;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

input {
  border-radius: 10px;
  padding: 12px;
}
#reply {
  font-size: 18px;
  margin-top: 20px;
}

input {
  font-size: 16px;
}

button {
  font-size: 16px;
}
.chat-area {
  background: white;
  padding: 20px;
  border-radius: 15px;
}

#reply {
  background: #f1f1f1;
  padding: 15px;
  border-radius: 10px;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

#userInput {
  width: 70%;
  padding: 12px;
  border-radius: 15px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.chat-box button {
  padding: 12px 20px;
  border-radius: 15px;
  font-size: 16px;
}

#reply {
  text-align: left;
  margin-top: 20px;
  background: #f1f1f1;
  padding: 15px;
  border-radius: 15px;
  line-height: 1.6;
  }  
</style>
</head>

<body>
<div class="box">
<h1>Nova Designs ✨</h1>
<p>Ku soo dhawoow AI Assistant-kayaga.</p>

<h3>Adeegyadeena</h3>
<p>
Logo Design<br>
Branding<br>
Website Design<br>
Prescription Pad Design
</p>

<button>La hadal AI</button>
</div>
<div class="chat-box">
<input id="userInput" placeholder="Qor su'aashaada..." style="padding:10px;width:70%;">
<button onclick="chat()">Dir</button>
<p id="reply"></p>
</div>
  
<script>
function chat(){
  
let msg = document.getElementById("userInput").value.toLowerCase();
let answer = "";

if(msg.includes("logo")){
answer = "Ku soo dhawoow 𝑵𝑶𝑽𝑨 𝑫𝑬𝑺𝑰𝑮𝑵𝑺 ✨. Waxaan kuu sameyn karnaa Logo Design casri ah oo xirfad leh, kaas oo matalaya ganacsigaaga una muuqda mid soo jiita macaamiisha. Waxaan kuu diyaarin karnaa naqshad ku habboon magaca iyo fikradda ganacsigaaga.";
}

else if(msg.includes("website")){
answer = "𝑵𝑶𝑽𝑨 𝑫𝑬𝑺𝑰𝑮𝑵𝑺 ✨ waxaan sameynaa Website Design casri ah oo fudud in la isticmaalo. Website-ka wuxuu kaa caawinayaa inaad ganacsigaaga ku soo bandhigto internet-ka oo aad hesho macaamiil badan.";
}

else if(msg.includes("qiimo") || msg.includes("lacag") || msg.includes("price")){
answer = "Qiimaha adeegyada 𝑵𝑶𝑽𝑨 𝑫𝑬𝑺𝑰𝑮𝑵𝑺 ✨ wuxuu ku xiran yahay adeegga aad rabto iyo faahfaahinta mashruuca. Nala soo xiriir si aan kuugu sharaxno qiimaha, habka lacag bixinta iyo tallaabooyinka dalabka.";
}

else if(msg.includes("dalbo") || msg.includes("order")){
answer = "Si aad u dalbato adeegga 𝑵𝑶𝑽𝑨 𝑫𝑬𝑺𝑰𝑮𝑵𝑺 ✨, noo soo dir magaca adeegga aad rabto, faahfaahinta ganacsigaaga, iyo wixii fikrad ah ee aad qabto. Kadib waxaan kuu diyaarin doonaa naqshad xirfad leh.";
}

else if(msg.includes("prescription") || msg.includes("farmashi")){
answer = "Waxaan naqshadeynaa Prescription Pad casri ah oo loogu talagalay farmashiyeyaasha iyo xarumaha caafimaadka. Waxaa lagu dari karaa magaca, logo-ga, cinwaanka iyo xogta muhiimka ah ee ganacsiga.";
}

else if(msg.includes("book") || msg.includes("cover")){
answer = "Waxaan kuu sameyn karnaa Book Cover qurux badan oo xirfad leh, kaas oo ka dhigaya buuggaaga mid soo jiita akhristayaasha.";
}

else if(msg.includes("business card")){
answer = "Waxaan sameynaa Business Card professional ah oo kaa caawinaya inaad si fiican u soo bandhigto ganacsigaaga iyo xiriirka macaamiisha.";
}

else{
answer = "Ku soo dhawoow 𝑵𝑶𝑽𝑨 𝑫𝑬𝑺𝑰𝑮𝑵𝑺 ✨. Waxaan kaa caawin karnaa Logo Design, Website Design, Branding, Book Cover, Business Card, Prescription Pad iyo adeegyo kale oo naqshadeyn ah. Fadlan ii sheeg adeegga aad rabto.";
}

document.getElementById("reply").innerHTML = answer;

}
</script>
  
</body>
</html>
