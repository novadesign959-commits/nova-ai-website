<!DOCTYPE html>
<html>
<head>
<title>Nova Designs AI Assistant</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  padding: 40px;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
}
h1 {
  color: #333;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

input {
  border-radius: 10px;
  padding: 12px;
}
#reply {
  font-size: 18px;
  margin-top: 20px;
}

input {
  font-size: 16px;
}

button {
  font-size: 16px;
}
.chat-area {
  background: white;
  padding: 20px;
  border-radius: 15px;
}

#reply {
  background: #f1f1f1;
  padding: 15px;
  border-radius: 10px;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

#userInput {
  width: 70%;
  padding: 12px;
  border-radius: 15px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.chat-box button {
  padding: 12px 20px;
  border-radius: 15px;
  font-size: 16px;
}

#reply {
  text-align: left;
  margin-top: 20px;
  background: #f1f1f1;
  padding: 15px;
  border-radius: 15px;
  line-height: 1.6;
  }  
  .chat-message {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  max-width: 80%;
  font-size: 16px;
  line-height: 1.5;
}

.user-message {
  background: #222;
  color: white;
  padding: 12px 15px;
  border-radius: 18px 18px 0 18px;
  margin: 10px 0;
  margin-left: auto;
  max-width: 80%;
  text-align: right;
}

.ai-message {
  background: white;
  color: #333;
  padding: 12px 15px;
  border-radius: 18px 18px 18px 0;
  margin: 10px 0;
  margin-right: auto;
  max-width: 80%;
  text-align: left;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }

.dot {
  animation: blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay: 0.2s;
}

.dot:nth-child(3){
  animation-delay: 0.4s;
}

@keyframes blink {
  50% {
    opacity: 0.2;
  }
}
.dark {
  background:#111;
  color:white;
}

.dark .box,
.dark .chat-box {
  background:#222;
  color:white;
}

.dark input {
  background:#333;
  color:white;
  }
.logo-area {
  width: 90px;
  height: 90px;
  margin: auto;
  border-radius: 50%;
}

.logo-area img {
  width: 100%;
  height: 100%;
  border-radius: 50%;
}
</style>
</head>

<body>
<div class="box">
<div class="logo-area">
<img src="logo.png">
</div>
<b>Nova AI</b>
<h1>Nova Designs ✨</h1>
<p>Ku soo dhawoow AI Assistant-kayaga.</p>

<h3>Adeegyadeena</h3>
<p>
Logo Design<br>
Branding<br>
Website Design<br>
Prescription Pad Design
</p>

<button>La hadal AI</button>
<button onclick="darkMode()">🌙 Dark Mode</button>
</div>
<div class="chat-box">
<div class="ai-header">
  <img src="logo.png" class="ai-logo">
  <b>Nova AI</b>
</div>
<input id="userInput" placeholder="Qor su'aashaada..." style="padding:10px;width:70%;" onkeypress="if(event.key==='Enter'){chat();}">
<button onclick="chat()">Dir</button>
<div id="reply"></div>
</div>

<script>
function darkMode(){
document.body.classList.toggle("dark");
}
function chat(){

let msg = document.getElementById("userInput").value.toLowerCase();
let answer = "";

if(msg.includes("logo")){
answer = "🎨 Nova Designs ✨ waxay kuu samayn kartaa Logo casri ah oo xirfad leh, ku habboon ganacsigaaga.";
}

else if(msg.includes("website") || msg.includes("web")){
answer = "🌐 Waxaan dhisnaa website-yo casri ah oo degdeg ah, kuna shaqeeya mobile iyo computer.";
}

else if(msg.includes("brand") || msg.includes("branding")){
answer = "🎯 Waxaan bixinnaa adeegyo Branding ah sida Logo, Midabada ganacsiga, Business Card iyo Identity dhamaystiran.";
}

else if(msg.includes("prescription") || msg.includes("farmashi")){
answer = "💊 Waxaan naqshadeynaa Prescription Pad casri ah oo loogu talagalay farmashiyeyaasha iyo xarumaha caafimaadka.";
}

else if(msg.includes("book") || msg.includes("cover")){
answer = "📚 Waxaan kuu samayn karnaa Book Cover qurux badan oo soo jiidasho leh.";
}

else if(msg.includes("business card")){
answer = "💼 Waxaan sameynaa Business Card professional ah oo tayo sare leh.";
}

else if(msg.includes("price") || msg.includes("qiimo") || msg.includes("lacag")){
answer = "💰 Qiimaha wuxuu ku xiran yahay adeegga aad rabto. Fadlan nala soo xiriir si aan kuu siino qiimaha saxda ah.";
}

else if(msg.includes("order") || msg.includes("dalbo")){
answer = "📩 Si aad u dalbato adeeg, noo soo dir magaca adeegga iyo faahfaahinta aad rabto.";
}

else if(msg.includes("contact") || msg.includes("xiriir") || msg.includes("whatsapp")){
answer = "📱 Nala soo xiriir WhatsApp: +252 711552370";
}

else if(msg.includes("hello") || msg.includes("hi") || msg.includes("asc") || msg.includes("asalaamu")){
answer = "👋 Ku soo dhawoow Nova Designs ✨. Sideen maanta kuu caawin karaa?";
}

else{
answer = "🤖 Ku soo dhawoow Nova Designs ✨. Waxaan bixinnaa Logo Design, Website Design, Branding, Business Card, Book Cover, Prescription Pad iyo adeegyo kale. Wixii faahfaahin ah WhatsApp: +252 711552370.";
}

document.getElementById("reply").innerHTML +=
'<div class="user-message">' + msg + '</div>';

document.getElementById("reply").innerHTML +=
'<div class="ai-message">🤖 <b>Nova AI</b><br>' + answer + '</div>';

document.getElementById("userInput").value = "";

document.getElementById("reply").scrollTop =
document.getElementById("reply").scrollHeight;  
  }
</script>
  
</body>
</html>
