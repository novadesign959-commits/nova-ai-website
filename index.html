<!DOCTYPE html>
<html>
<head>
<title>Nova Designs AI Assistant</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  padding: 40px;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
}
h1 {
  color: #333;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

input {
  border-radius: 10px;
  padding: 12px;
}
</style>
</head>

<body>
<div class="box">
<h1>Nova Designs ✨</h1>
<p>Ku soo dhawoow AI Assistant-kayaga.</p>

<h3>Adeegyadeena</h3>
<p>
Logo Design<br>
Branding<br>
Website Design<br>
Prescription Pad Design
</p>

<button>La hadal AI</button>
</div>
  <div style="margin-top:20px;">
<input id="userInput" placeholder="Qor su'aashaada..." style="padding:10px;width:70%;">
<button onclick="chat()">Dir</button>
<p id="reply"></p>
</div>
<script>
function chat(){
let msg = document.getElementById("userInput").value.toLowerCase();
let answer = "";

if(msg.includes("logo")){
answer = "✨ Waxaan kuu sameyn karnaa Logo Design casri ah oo xirfad leh.";
}
else if(msg.includes("website")){
answer = "💻 Waxaan sameynaa Website Design tayo leh oo ku habboon ganacsigaaga.";
}
else if(msg.includes("book") || msg.includes("cover")){
answer = "📚 Waxaan kuu naqshadeynaa Book Cover qurux badan.";
}
else if(msg.includes("business")){
answer = "💳 Waxaan sameynaa Business Card professional ah.";
}
else if(msg.includes("branding")){
answer = "🚀 Waxaan kaa caawineynaa Branding dhammeystiran.";
}
else if(msg.includes("prescription") || msg.includes("farmashi")){
answer = "🏥 Waxaan naqshadeynaa Prescription Pad casri ah.";
}
else{
answer = "🤖 Ku soo dhawoow Nova Designs AI Assistant ✨ Waxaan kaa caawin karnaa adeegyada design-ka.";
}

document.getElementById("reply").innerHTML = answer;
}
</script>

</body>
</html>
