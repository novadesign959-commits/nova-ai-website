<!DOCTYPE html>
<html>
<head>
<title>Nova Designs AI Assistant</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  padding: 40px;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
}
h1 {
  color: #333;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
}
</style>
</head>

<body>
<div class="box">
<h1>Nova Designs ✨</h1>
<p>Ku soo dhawoow AI Assistant-kayaga.</p>

<h3>Adeegyadeena</h3>
<p>
Logo Design<br>
Branding<br>
Website Design<br>
Prescription Pad Design
</p>

<button>La hadal AI</button>
</div>
  <div style="margin-top:20px;">
<input id="userInput" placeholder="Qor su'aashaada..." style="padding:10px;width:70%;">
<button onclick="chat()">Dir</button>
<p id="reply"></p>
</div>

<script>
function chat(){
let msg = document.getElementById("userInput").value;
let answer = "";

if(msg.toLowerCase().includes("logo")){
answer = "Waxaan kuu sameyn karnaa Logo Design casri ah oo qurux badan ✨";
}
else if(msg.toLowerCase().includes("website")){
answer = "Waxaan sameynaa Website Design tayo leh 💻";
}
else if(msg.toLowerCase().includes("prescription")){
answer = "Waxaan naqshadeynaa Prescription Pad loogu talagalay farmashiyeyaasha 🏥";
}
else{
answer = "Ku soo dhawoow Nova Designs ✨ Waxaan kaa caawin karnaa adeegyada design-ka.";
}

document.getElementById("reply").innerHTML = answer;
}
</script>
</body>
</html>
