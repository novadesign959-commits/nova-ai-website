<!DOCTYPE html>
<html>
<head>
<title>Nova Designs AI Assistant</title>
<style>
body {
  font-family: Arial;
  text-align: center;
  background: #f5f5f5;
  padding: 40px;
}
.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
}
h1 {
  color: #333;
}
button {
  padding: 12px 25px;
  border: none;
  border-radius: 10px;
  background: black;
  color: white;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 15px;
}

input {
  border-radius: 10px;
  padding: 12px;
}
#reply {
  font-size: 18px;
  margin-top: 20px;
}

input {
  font-size: 16px;
}

button {
  font-size: 16px;
}
.chat-area {
  background: white;
  padding: 20px;
  border-radius: 15px;
}

#reply {
  background: #f1f1f1;
  padding: 15px;
  border-radius: 10px;
}
.chat-box {
  margin-top: 20px;
  background: white;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}

#userInput {
  width: 70%;
  padding: 12px;
  border-radius: 15px;
  border: 1px solid #ccc;
  font-size: 16px;
}

.chat-box button {
  padding: 12px 20px;
  border-radius: 15px;
  font-size: 16px;
}

#reply {
  text-align: left;
  margin-top: 20px;
  background: #f1f1f1;
  padding: 15px;
  border-radius: 15px;
  line-height: 1.6;
  }  
  .chat-message {
  padding: 12px 15px;
  margin: 10px 0;
  border-radius: 15px;
  max-width: 80%;
  font-size: 16px;
  line-height: 1.5;
}

.user-message {
  background: #333;
  color: white;
  padding: 12px 15px;
  border-radius: 15px;
  margin: 10px 0;
  margin-left: auto;
  max-width: 80%;
  text-align: right;
}
}

.ai-message {
  background: #f1f1f1;
  color: #333;
  margin-right: auto;
  text-align: left;
}
.dot {
  animation: blink 1s infinite;
}

.dot:nth-child(2){
  animation-delay: 0.2s;
}

.dot:nth-child(3){
  animation-delay: 0.4s;
}

@keyframes blink {
  50% {
    opacity: 0.2;
  }
}
</style>
</head>

<body>
<div class="box">
<h1>Nova Designs ✨</h1>
<p>Ku soo dhawoow AI Assistant-kayaga.</p>

<h3>Adeegyadeena</h3>
<p>
Logo Design<br>
Branding<br>
Website Design<br>
Prescription Pad Design
</p>

<button>La hadal AI</button>
</div>
<div class="chat-box">
<input id="userInput" placeholder="Qor su'aashaada..." style="padding:10px;width:70%;" onkeypress="if(event.key==='Enter'){chat();}">
<button onclick="chat()">Dir</button>
<div id="reply"></div>
</div>

<script>
async function chat() {

const msg = document.getElementById("userInput").value;

document.getElementById("reply").innerHTML +=
'<div class="user-message">' + msg + '</div>';

document.getElementById("reply").innerHTML +=
'<div id="typing" class="ai-message">🤖 Nova AI is typing...</div>';

const res = await fetch("/api/chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json"
  },
  body: JSON.stringify({
    message: msg
  })
});

const data = await res.json();

document.getElementById("typing").remove();

document.getElementById("reply").innerHTML +=
'<div class="ai-message">🤖 <b>Nova AI</b><br>' + data.answer + '</div>';

document.getElementById("userInput").value = "";

  }
</script>
  
</body>
</html>
